# Local Postgres for development. Matches the Supabase project's major version (17).
# Start with `npm run db:up`, stop with `npm run db:down`. Data persists in the
# `trc-pgdata` volume until you run `docker compose down -v`.
services:
  db:
    image: postgres:17-alpine
    container_name: trc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trc
    ports:
      - "5432:5432"
    volumes:
      - trc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trc"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  trc-pgdata:
